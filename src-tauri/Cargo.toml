[package]
name = "attendance-tracker"
version = "1.0.0"
description = "A local-first attendance tracker for macOS"
authors = ["Vinod Sathyaseelan"]
license = "MIT"
repository = "https://github.com/Vinodsathyaseelan/attendance-tracker"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
tauri-plugin-store = "2.5.0"
